<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Number Blocks - Smart TV Mirror</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: #2b2d42;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }
    .card {
      background: rgba(0, 0, 0, 0.3);
      border: 2px solid rgba(244, 162, 97, 0.4);
      padding: 3rem 4rem;
      border-radius: 24px;
      max-width: 520px;
      width: 90%;
    }
    h1 { font-size: 2.2rem; margin-bottom: 0.75rem; color: #f4a261; }
    p { font-size: 1.1rem; color: #e2e8f0; margin-bottom: 2rem; line-height: 1.5; }
    input {
      width: 100%;
      font-size: 2.5rem;
      letter-spacing: 0.4rem;
      text-align: center;
      padding: 0.8rem;
      border-radius: 14px;
      border: 3px solid #f4a261;
      background: #1d1e2c;
      color: #fff;
      margin-bottom: 1.5rem;
      outline: none;
    }
    button {
      width: 100%;
      padding: 1rem;
      font-size: 1.3rem;
      font-weight: 700;
      border: none;
      border-radius: 14px;
      background: #e07a5f;
      color: #fff;
      cursor: pointer;
    }
    button:focus, button:hover { background: #e76f51; transform: scale(1.02); }
  </style>
</head>
<body>
  <div class="card">
    <h1>📺 Smart TV Mirror</h1>
    <p>Tap the <strong>📺 TV</strong> button on your phone or tablet and enter the 4-digit room code:</p>
    <form id="tvJoinForm">
      <input type="tel" id="codeInput" maxlength="4" pattern="[0-9]{4}" placeholder="0000" required autofocus />
      <button type="submit">Start Mirroring</button>
    </form>
  </div>

  <script>
    document.getElementById('tvJoinForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const code = document.getElementById('codeInput').value.trim();
      if (code.length === 4) {
        window.location.href = `./index.html?tv=${encodeURIComponent(code)}`;
      }
    });
  </script>
</body>
</html>
