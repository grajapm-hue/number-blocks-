<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Orientation & Slide Check</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="HedgehogMaze">
  <meta name="theme-color" content="#2b2d42">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png?v=2">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png?v=2">
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="app-container">
    <header class="game-header">
      <h1>🧩 Orientation & Slide Check</h1>
      <p class="subtitle">Slide all 8 blocks into the target box!</p>
    </header>

    <div class="game-area">
      <div class="blocks-container" id="blocks-container">
        <!-- 8 Blocks generated via JS -->
      </div>
      <div class="target-box" id="target-box">
        <span>Target Zone (<span id="joined-count">0</span>/8)</span>
      </div>
    </div>

    <footer class="game-footer">
      <div class="score-board">Status: <span id="status-text">Dragging...</span></div>
      <button id="reset-btn">Reset Puzzle</button>
    </footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
